# pyproject.toml
[project]
name = "cycas"
description = "Post-process and ingest forensic artifacts (collected with Velociraptor) into Azure Data Explorer (ADX)."
version = "0.1.0"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "azure-functions",
    "azure-common==1.1.28",
    "azure-core==1.34.0",
    "azure-data-tables==12.6.0",
    "azure-functions==1.23.0",
    "azure-identity==1.21.0",
    "azure-keyvault-secrets==4.9.0",
    "azure-kusto-data==5.0.2",
    "azure-kusto-ingest==5.0.2",
    "azure-mgmt-core==1.5.0",
    "azure-mgmt-kusto==3.4.0",
    "azure-mgmt-resource==23.3.0",
    "azure-mgmt-authorization==4.0.0",
    "azure-mgmt-storage==21.2.1",
    "azure-mgmt-web==7.3.1",
    "azure-storage-blob==12.25.1",
    "azure-storage-queue==12.12.0",
    "pandas==2.2.3",
    "paramiko==3.5.1",
    "dotenv==0.9.9",
    "pyzipper==0.3.6",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "pydantic_settings==2.13.0",
    "flask>=3.1.0",
    "gunicorn>=23.0.0"
]

[project.urls]
repository = "https://github.com/nerium-security/cycas"

[tool.setuptools.packages.find]
where = ["."]
