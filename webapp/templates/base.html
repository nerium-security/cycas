<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cycas{% endblock %} - Nerium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
    <a class="logo" href="{{ url_for('index') }}">Cycas <span>by Nerium</span></a>
    <div class="nav-links">
        <a class="nav-link{% if request.endpoint == 'index' %} nav-link-active{% endif %}" href="{{ url_for('index') }}">Home</a>
        <a class="nav-link{% if request.endpoint == 'artifacts_page' %} nav-link-active{% endif %}" href="{{ url_for('artifacts_page') }}">Settings</a>
    </div>
</nav>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
