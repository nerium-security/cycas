  - name: Devices
    type: json_array
    default: '["C:"]'
    description: Drive letters to search.

  - name: DropVerySlowRules
    type: bool
    default: Y

  - name: TrustedPathRegex
    type: regex
    default: ^C:\\\\
    description: |
      Do not hash or upload any adaptive files matching this regex.

  - name: MaxFileSize
    type: int
    description: Max individual file size in bytes (0 = unlimited).

  - name: VSS_MAX_AGE_DAYS
    type: int
    default: 0

  - name: WORKERS
    type: int
    default: "5"

required_permissions:
  - FILESYSTEM_READ
  - FILESYSTEM_WRITE

resources:
  timeout: 3600

sources:
  - name: AzureUpload

    precondition: |
      SELECT * FROM info() WHERE OS = "windows"

    query: |
      LET _ = SELECT * FROM Artifact.Windows.Triage.Targets()

      // 1. Build the blob name
      LET Hostname_org <= SELECT Hostname FROM info()
      LET Hostname <= Hostname_org[0].Hostname
      LET Timestamp <= format(format="%v", args=[timestamp(epoch=now())])

      LET ZipName <= if(
        condition=UploadPrefix,
        then=format(
          format="%v/%v-%v.zip",
          args=[
            regex_replace(source=UploadPrefix, re="/$", replace=""),
            Hostname,
            Timestamp
          ]
        ),
        else=format(format="%v-%v.zip", args=[Hostname, Timestamp])
      )

      // 2. Create a temp path for the zip on disk ────────────────────────────
      LET TempZip <= tempfile(extension=".zip", remove_last=TRUE)

      // 3. Collect Windows.Triage.Targets into the zip ──────────────────────
      //    collect() runs the artifact and stores all uploaded files into
      //    a zip container at the path we provide via `output`.
      //    The `password` arg is optional — empty string means no encryption.
      LET ZipResult <= SELECT *
      FROM collect(
        artifacts="Windows.Triage.Targets",
        args=dict(
          `Windows.Triage.Targets`=dict(
            HighLevelTargets=serialize(item=HighLevelTargets, format="json"),
            Targets=serialize(item=Targets, format="json"),
            Devices=Devices,
            DropVerySlowRules=DropVerySlowRules,
            TrustedPathRegex=TrustedPathRegex,
            MaxFileSize=MaxFileSize,
            VSS_MAX_AGE_DAYS=VSS_MAX_AGE_DAYS,
            WORKERS=WORKERS
          )
        ),
        output=TempZip,
        password=ZipPassword
      )

      // 4. Upload the zip to Azure Blob Storage
      SELECT
        ZipName AS BlobPath,
        TempZip AS LocalZip,
        upload_azure(
          file=TempZip,
          accessor="file",
          sas_url=SasURL,
          name=ZipName
        ) AS AzureUpload
      FROM ZipResult