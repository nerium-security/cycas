name: Custom.Windows.Triage.Targets.AzureUpload
description: |
  Collects Windows.Triage.Targets, zips the results on the endpoint,
  then uploads the single zip directly to Azure Blob Storage via SAS URL.
  Meaning the results are not uploaded to the Velociraptor server.
  
  To run this artefact, you need to import Windows.Triage.Targets first: 
  - https://triage.velocidex.com/docs/windows.triage.targets/

  ## Generating a write-only SAS URL
  Azure Portal → Storage Account → Containers → <container> →
  Shared access tokens → Permissions: Write + Create (NOT Read/Delete) →
  Set expiry → Generate SAS token and URL → copy the Blob SAS URL.

parameters:
  - name: SasURL
    description: |
      Azure Blob Storage container SAS URL (Write + Create permissions only).
      e.g. https://myaccount.blob.core.windows.net/triage?sv=2022-11-02&...
    type: string

  - name: UploadPrefix
    description: |
      Optional folder prefix inside the container, e.g. "2024-IR/endpoint1".
      Leave blank to upload to the container root.
    default: ""
    type: string

  - name: ZipPassword
    description: |
      Optional password to encrypt the zip archive before upload.
      Leave blank for no encryption.
    default: ""
    type: string

  - name: HighLevelTargets
    type: multichoice
    default: "[]"
    choices:
      - _BasicCollection
      - _KapeTriage
      - _Live
      - _SANS_Triage

