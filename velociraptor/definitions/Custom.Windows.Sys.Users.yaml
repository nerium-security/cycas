name: Custom.Windows.Sys.Users
description: |
  Custom version that does not use lookUpSid() but infers the name from the path name with 

parameters:
  - name: remoteRegKey
    default: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\*

sources:
  - precondition:
      SELECT OS From info() where OS = 'windows'

    query: |
    
    
    
        LET GetTimestamp(High, Low) = if(condition=High,
                then=timestamp(winfiletime=High * 4294967296 + Low))
                
        LET adjustName(name) = if(condition=(name="systemprofile"), then="SYSTEM", else=name)
        LET getName(path) = adjustName(name=split(string=path, sep="\\\\")[-1])
        LET S = scope()
        LET getPath(SID) =SELECT * FROM glob(accessor="registry",
               globs="HKEY_LOCAL_MACHINE/Software/Microsoft/Windows NT/CurrentVersion/ProfileList/" +
                      SID + "/ProfileImagePath") 
                      
               -- lookupSID() may not be available on deaddisk analysis
        SELECT split(string=Key.OSPath.Basename, sep="-")[-1] as Uid,
           "" AS Gid,
           pathspec(parse=getPath(SID=Key.OSPath.Basename || "")[0].Data.value).Basename as Name,
           Key.OSPath as Description,
           ProfileImagePath as Directory,
           Key.OSPath.Basename as UUID,
           Key.OSPath as KEy,
           Key.Mtime as Mtime,
           {
                SELECT Mtime
                FROM stat(filename=expand(path=ProfileImagePath))
            } AS HomedirMtime,
           dict(ProfileLoadTime=GetTimestamp(
                   High=S.LocalProfileLoadTimeHigh, Low=S.LocalProfileLoadTimeLow),
                ProfileUnloadTime=GetTimestamp(
                   High=S.LocalProfileUnloadTimeHigh, Low=S.LocalProfileUnloadTimeLow)
           ) AS Data
        FROM read_reg_key(globs=remoteRegKey, accessor="registry")
        

