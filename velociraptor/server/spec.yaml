# Offline collector built on the Velociraptor server by bootstrap.py.
#
# The result is encrypted with the server's X509 certificate, so only this
# server can open it:
#   velociraptor --config server.config.yaml unzip --dump_dir output file.zip
#
# Replace this file by placing a spec.yaml in velociraptor/server/custom/.
# See `velociraptor collector` (without arguments) for all options.

OS: Windows

Artifacts:
  # Windows.KapeFiles.Targets was removed from Velociraptor in favour of
  # Windows.Triage.Targets; bootstrap.py downloads its definition.
  Windows.Triage.Targets:
    HighLevelTargets: '["_KapeTriage"]'
  Windows.System.DNSCache: {}
  Windows.Network.NetstatEnriched: {}
  Windows.Network.InterfaceAddresses: {}
  Windows.System.DomainRole: {}
  Windows.System.Pslist: {}

Target: ZIP
TargetArgs: {}

EncryptionScheme: X509

OptVerbose: Y
OptBanner: N
OptPrompt: N
OptAdmin: Y
OptTempdir: .
OptLevel: 5
OptFilenameTemplate: "Collection-%FQDN%-%TIMESTAMP%"
OptFormat: jsonl
